name: Update news headlines
on:
  schedule:
    # GitHub heavily throttles scheduled runs (observed gaps of 2-7 h with */15), so use several off-peak minutes per hour.
    - cron: '11 * * * *'
    - cron: '26 * * * *'
    - cron: '41 * * * *'
    - cron: '56 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-news
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11 requests==2.32.3
      - run: python _news-tools/fetch_news.py
      - name: Commit if headlines changed
        run: |
          git config user.name "launchpad-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data index.html around-the-state/index.html
          git diff --cached --quiet || git commit -m "Update news headlines"
          git pull --rebase -X theirs || true
          git push
