name = "lp-newsletter"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "lp-newsletter"
database_id = "e6295fce-460f-4f37-b56f-2a18c28a4534"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://launchpaddigitalfl.com"
PUBLIC_URL = "https://lp-newsletter.launchpaddigitalfl.workers.dev"  # Worker's public URL (custom domain or *.workers.dev)
ALLOWED_ORIGINS = "https://launchpaddigitalfl.com,https://www.launchpaddigitalfl.com,http://localhost:8080"
FROM_EMAIL = "editor@launchpaddigitalfl.com"
FROM_NAME = "Launchpad Digital"
REPLY_TO = "editor@launchpaddigitalfl.com"
POSTAL_ADDRESS = "Launchpad Digital L.L.C., 2173 Tarrytown Ln, Palm Bay, FL 32905"
EMAIL_PROVIDER = "brevo"         # log | brevo | ses
SMS_ENABLED = "false"           # SMS on hold: hides texts box on preferences, server ignores SMS fields
SMS_PROVIDER = "log"            # log | twilio | brevo (stubbed: nothing sends until SMS_LIVE="1" and live code is added)
DAILY_SEND_CAP = "300"          # Brevo free = 300/day
ISSUE_FEED_URL = ""             # optional JSON feed of stories for cron-built issues

# Secrets (set with `wrangler secret put NAME`, never committed):
# ADMIN_TOKEN, BREVO_API_KEY, SMS_WEBHOOK_SECRET, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, STRIPE_WEBHOOK_SECRET

[triggers]
# 11:00 UTC daily (7 AM EDT / 6 AM EST). Weekly = Mondays, monthly = 1st; decided in code.
crons = ["0 11 * * *"]
